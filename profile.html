<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  display:flex;
  background:#0d0d0d;
  color:#fff;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#111;
  padding:20px;
  position:fixed;
}

.sidebar h2{
  margin-bottom:30px;
}

.sidebar ul{
  list-style:none;
}

.sidebar ul li{
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.sidebar ul li.active,
.sidebar ul li:hover{
  background:#ff7a00;
}

.sidebar ul li a{
  color:white;
  text-decoration:none;
}

/* MAIN */
.main{
  margin-left:240px;
  width:100%;
  padding:20px;
}

/* PROFILE CARD */
.profile-card{
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
  display:flex;
  gap:20px;
  align-items:center;
}

/* IMAGE */
.profile-img{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

/* INFO */
.profile-info h2{
  margin-bottom:5px;
}

.profile-info p{
  color:#aaa;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#ff7a00;
  color:#fff;
  cursor:pointer;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:20px;
}

.stat{
  background:#1a1a1a;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

/* ACTIVITY */
.activity{
  margin-top:20px;
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
}

.activity p{
  margin:10px 0;
}

/* MOBILE */
@media(max-width:900px){
  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
  }

  .profile-card{
    flex-direction:column;
    text-align:center;
  }

  .stats{
    grid-template-columns:1fr;
  }
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>STACKLY</h2>

  <ul>
    <li><a href="admin.html">📊 Dashboard</a></li>
    <li><a href="analytics.html">📈 Analytics</a></li>
    <li><a href="database.html">🗄️ Databases</a></li>
    <li class="active"><a href="profile.html">👤 Profile</a></li>
    <li><a href="login.html">🚪 Logout</a></li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <h2>My Profile</h2>

  <!-- PROFILE CARD -->
  <div class="profile-card">

    <div class="profile-img" id="profileImg">👤</div>

    <div class="profile-info">
      <h2 id="name">Harini</h2>
      <p id="email">harini@gmail.com</p>
      <p id="role">Admin</p>

      <button onclick="editProfile()">Edit Profile</button>
    </div>

  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <h3>Projects</h3>
      <h2>12</h2>
    </div>

    <div class="stat">
      <h3>Tasks</h3>
      <h2>48</h2>
    </div>

    <div class="stat">
      <h3>Completed</h3>
      <h2>35</h2>
    </div>
  </div>

  <!-- ACTIVITY -->
  <div class="activity">
    <h3>Recent Activity</h3>
    <p>✔ Completed dashboard UI</p>
    <p>🕒 Updated analytics page</p>
    <p>📁 Added new project</p>
  </div>

</div>

<script>
function editProfile(){
  let newName = prompt("Enter Name:");
  let newEmail = prompt("Enter Email:");
  let newRole = prompt("Enter Role:");

  if(newName) document.getElementById("name").innerText = newName;
  if(newEmail) document.getElementById("email").innerText = newEmail;
  if(newRole) document.getElementById("role").innerText = newRole;
}
</script>

</body>
</html>
