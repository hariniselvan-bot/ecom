<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* MAIN */
.login-container{
  display:flex;
  height:100vh;
}

/* LEFT */
.left{
  flex:1;
  background:url("bbg.webp") center/cover no-repeat;
  position:relative;
  color:#fff;
}

.left::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
}

.back{
  position:absolute;
  top:30px;
  left:30px;
  color:#fff;
  text-decoration:none;
}

.left-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
}

.left-content h2{
  color:#ffb300;
}

.left-content h1{
  font-size:42px;
  margin:20px 0;
  font-weight:800;
}

/* RIGHT */
.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#1c1c1c);
}

/* FORM */
.form-box{
  width:400px;
  padding:40px;
  border-radius:20px;
  background:#000;
  color:#fff;
}

/* INPUT */
input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#222;
  color:#fff;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  background:#ffb300;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
  .login-container{
    flex-direction:column;
  }
}

</style>
</head>

<body>

<div class="login-container">

  <!-- LEFT -->
  <div class="left">
    <a href="home.html" class="back">← Back</a>

    <div class="left-content">
      <h2>Stackly</h2>
      <h1>Create Account</h1>
      <p>Join us and explore premium features</p>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="form-box">

      <h2>Sign Up</h2>

      <form id="signupForm">

      

        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>

        <button type="submit" class="btn">Create Account</button>

      </form>

      <p style="margin-top:15px;">
        Already have account? <a href="login.html" style="color:#ffb300;">Login</a>
      </p>

    </div>

  </div>

</div>

<script>

// SIGNUP REDIRECT
document.getElementById("signupForm").addEventListener("submit", function(e){
  e.preventDefault();

  const role = document.getElementById("role").value;

  if(role === ""){
    alert("Select role");
    return;
  }

  alert("Account Created!");

  if(role === "user"){
    window.location.href = "user.html";
  } else {
    window.location.href = "admin.html";
  }
});

</script>

</body>
</html>
