<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2 class="logo">STACKLY</h2>

  <ul>
    <li class="active"><a href="user.html">🏠 Home</a></li>
    <li><a href="schedule.html">📅 Schedule</a></li>
    <li><a href="reports.html">📊 Reports</a></li>
    <li><a href="projects.html">📁 Projects</a></li>
    <li><a href="chats.html">💬 Chats</a></li>
  </ul>

  <div class="bottom">
    <p><a href="login.html">🚪 Logout</a></p>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h2>Dashboard</h2>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- CARD 1 -->
    <div class="card">
      <h3>Task progress</h3>
      <div class="circle"><span>67%</span></div>
      <button onclick="location.href='projects.html'">Start now</button>
    </div>

    <!-- CARD 2 -->
    <div class="card">
      <h3>Today task</h3>
      <p>Edit network design</p>
      <div class="progress-bar">
        <div style="width:60%"></div>
      </div>
      <small>2/3</small><br><br>
      <button onclick="location.href='reports.html'">Send Feedback</button>
    </div>

    <!-- CARD 3 -->
    <div class="card large">
      <h3>Awesome performance</h3>
      <div class="graph"></div>
    </div>

    <!-- CARD 4 -->
    <div class="card">
      <h3>Main goal</h3>
      <p>Dashboard design</p>
      <div class="progress-bar">
        <div style="width:64%"></div>
      </div>
      <div class="progress-bar">
        <div style="width:87%"></div>
      </div>
    </div>

    <!-- CARD 5 -->
    <div class="card large">
      <h3>Assignment for team</h3>
      <p>Creating persona</p>
      <button class="orange">Pending</button><br><br>
      <p>Documents</p>
      <button class="orange">Progress</button>
    </div>

    <!-- CARD 6 -->
    <div class="card">
      <h3>Progress</h3>
      <div class="circle small"><span>47%</span></div>
      <button onclick="location.href='schedule.html'">Mark complete</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
<style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  display:flex;
  background:#0e0e0e;
  color:#fff;
}

/* LINKS */
a{
  text-decoration:none;
  color:white;
  display:block;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#111;
  padding:20px;
  position:fixed;
  transition:0.3s;
}

.logo{
  margin-bottom:30px;
}

.sidebar ul{
  list-style:none;
}

.sidebar ul li{
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}

.sidebar ul li.active,
.sidebar ul li:hover{
  background:#ff7a00;
}

.bottom{
  position:absolute;
  bottom:20px;
}

/* MAIN */
.main{
  margin-left:240px;
  width:100%;
  padding:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

.menu-btn{
  display:none;
  background:none;
  border:none;
  font-size:20px;
  color:white;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* CARDS */
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
}

.card.large{
  grid-column:span 2;
}

/* CIRCLE */
.circle{
  width:100px;
  height:100px;
  border-radius:50%;
  border:6px solid #333;
  border-top:6px solid #ff7a00;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:10px 0;
}

.circle.small{
  width:80px;
  height:80px;
}

/* PROGRESS */
.progress-bar{
  width:100%;
  height:8px;
  background:#333;
  border-radius:10px;
  margin:10px 0;
}

.progress-bar div{
  height:100%;
  background:#ff7a00;
  border-radius:10px;
}

/* BUTTON */
button{
  background:#333;
  border:none;
  padding:10px;
  color:#fff;
  border-radius:10px;
  cursor:pointer;
}

button.orange{
  background:#ff7a00;
}

/* GRAPH */
.graph{
  height:100px;
  background:linear-gradient(to right, transparent, #ff7a00);
  border-radius:10px;
}

/* MOBILE */
@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }

  .sidebar{
    left:-100%;
  }

  .sidebar.active{
    left:0;
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }
}
/* FIX SIDEBAR LAYER */
.sidebar{
  z-index:1000;
}

/* SMOOTH ANIMATION */
.sidebar{
  transition:0.3s ease;
}

/* MOBILE FIX */
@media(max-width:900px){

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    width:240px;
    height:100%;
    background:#111;
  }

  .sidebar.active{
    left:0;
  }

  /* OVERLAY EFFECT */
  body.active-overlay::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    top:0;
    left:0;
    z-index:999;
  }
}
</style>
<script>
function toggleMenu(){
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("active");
}

// CLOSE when clicking outside (mobile fix)
document.addEventListener("click", function(e){
  const sidebar = document.getElementById("sidebar");
  const menuBtn = document.querySelector(".menu-btn");

  if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
    sidebar.classList.remove("active");
  }
});
function toggleMenu(){
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("active");

  document.body.classList.toggle("active-overlay");
}
</script>
