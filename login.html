<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  word-wrap:break-word;
}

/* MAIN */
.login-container{
  display:flex;
  min-height:100vh;
}

/* LEFT */
.left{
  flex:1;
  background:url("bbg.webp") center/cover no-repeat;
  position:relative;
  color:#fff;
}

.left::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
}

/* BACK */
.back{
  position:absolute;
  top:25px;
  left:25px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  z-index:2;
  transition:0.3s;
}
.back:hover{
  color:#ffb300;
}
.back:active{
  transform:scale(0.9);
}

/* LEFT CONTENT */
.left-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
  max-width:420px;
  width:90%;
}

.left-content h2{ color:#ffb300; }
.left-content h1{ font-size:40px; margin:15px 0; }
.left-content p{ opacity:0.8; font-size:14px; }

/* STATS */
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:30px;
}
.stats h3{ color:#ffb300; }

/* RIGHT */
.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#1c1c1c);
  padding:20px;
  position:relative;
}

/* FORM */
.form-box{
  width:100%;
  max-width:380px;
  padding:35px;
  border-radius:20px;
  background:#000;
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;
}

/* TITLE */
.form-box h2{ font-size:28px; }
.form-box p{
  font-size:13px;
  opacity:0.7;
  margin-bottom:20px;
}

/* INPUT */
label{ font-size:13px; }

input, select{
  width:100%;
  padding:12px 14px;
  margin:8px 0 15px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
  outline:none;
}

/* PASSWORD */
.password-box{
  position:relative;
}
.password-box input{
  padding-right:40px;
}
.password-box i{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* ROW */
.row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
}
.remember{
  display:flex;
  align-items:center;
  gap:5px;
}

/* FORGOT */
.forgot{
  color:#ffb300;
  text-decoration:none;
}

/* BUTTON */
.btn{
  width:100%;
  padding:13px;
  background:linear-gradient(45deg,#ffb300,#ff8800);
  border:none;
  border-radius:10px;
  color:#000;
  font-weight:600;
  margin-top:15px;
  cursor:pointer;
}

/* SOCIAL */
.social{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.social button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

/* SIGNUP */
.signup{
  margin-top:15px;
  font-size:13px;
}
.signup a{
  color:#ffb300;
}

/* MOBILE FIX */
@media(max-width:900px){

  /* ❌ REMOVE LEFT COMPLETELY */
  .left{
    display:none;
  }

  /* ✅ FULL SCREEN FORM */
  .right{
    width:100%;
    min-height:100vh;
    padding:20px;
  }

  .form-box{
    max-width:400px;
    padding:25px;
  }

  .social{
    flex-direction:column;
  }

  /* ✅ SHOW BACK BUTTON HERE */
  .mobile-back{
    display:block;
    position:absolute;
    top:20px;
    left:20px;
    color:#fff;
    text-decoration:none;
    font-size:14px;
  }
}

/* DESKTOP - HIDE MOBILE BACK */
.mobile-back{
  display:none;
}

/* FORCE SHOW ON MOBILE */
@media(max-width:900px){
  .mobile-back{
    display:block !important;
    position:absolute;
    top:20px;
    left:20px;
    color:#fff;
    font-size:16px;
    text-decoration:none;
    z-index:999;
  }
}select{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
  padding:12px 40px 12px 14px;
  border-radius:10px;
  border:none;
  width:100%;
  cursor:pointer;
}

/* custom arrow */
select{
  background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;
  background-position:right 10px center;
}.right{
  position:relative;
}
select{
  width:100%;
  padding:12px 40px 12px 14px;
  border-radius:10px;
  border:none;
  outline:none;
  color:#fff;
  background-color:#111; /* FIX */
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
}

/* dropdown options */
select option{
  background:#111;
  color:#fff;
}
select:focus{
  background-color:#111;
}
</style>
</head>

<body>

<div class="login-container">

  <!-- LEFT -->
  <div class="left">
    <a href="#" class="back" onclick="goBack()">← Back</a>

    <div class="left-content">
      <h2>Stackly</h2>
      <h1>Welcome Back!</h1>
      <p>Sign in to continue your journey.</p>

      <div class="stats">
        <div><h3>10K+</h3><p>Products</p></div>
        <div><h3>5K+</h3><p>Clients</p></div>
        <div><h3>15+</h3><p>Years</p></div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <!-- MOBILE BACK -->
    <a href="home.html" class="mobile-back" onclick="goBack()">← Back</a>

    <div class="form-box">

      <h2>Sign In</h2>
      <p>Access your account</p>

      <form id="loginForm">

        <label>Role</label>
        <select id="role" required>
          <option value="">Select role</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Password</label>
        <div class="password-box">
          <input type="password" id="pass" required>
          <i onclick="togglePass()">👁</i>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox"> Remember
          </label>
          <a href="404.html" class="forgot">Forgot?</a>
        </div>

        <button type="submit" class="btn">Sign In</button>

      </form>

      <div class="social">
        <button>Google</button>
        <button>Facebook</button>
      </div>

      <div class="signup">
        Don't have an account? <a href="sign.html">Sign up</a>
      </div>

    </div>

  </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const role = document.getElementById("role").value;

  if(role === ""){
    alert("Please select role!");
    return;
  }

  if(role === "user"){
    window.location.href = "user.html";
  } else {
    window.location.href = "admin.html";
  }
});

function togglePass(){
  const pass = document.getElementById("pass");
  pass.type = pass.type === "password" ? "text" : "password";
}

function goBack(){
  window.history.back();
}

</script>

</body>
</html>
