<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* MAIN */
.login-container{
  display:flex;
  min-height:100vh;
}

/* LEFT */
.left{
  flex:1;
  background:url("bbg.webp") center/cover no-repeat;
  position:relative;
  color:#fff;
}

.left::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
}

/* BACK */
.back{
  position:absolute;
  top:25px;
  left:25px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  z-index:2;
}

.back:hover{
  color:#ffb300;
}

/* LEFT CONTENT */
.left-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
  max-width:420px;
  width:90%;
}

.left-content h2{
  color:#ffb300;
}

.left-content h1{
  font-size:40px;
  margin:15px 0;
}

.left-content p{
  opacity:0.8;
  font-size:14px;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:30px;
}

.stats h3{
  color:#ffb300;
}

/* RIGHT */
.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#1c1c1c);
  padding:20px;
}

/* FORM */
.form-box{
  width:100%;
  max-width:380px;
  padding:35px;
  border-radius:20px;
  background:#000;
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;
}

/* TITLE */
.form-box h2{
  font-size:28px;
}

.form-box p{
  font-size:13px;
  opacity:0.7;
  margin-bottom:20px;
}

/* INPUT */
label{
  font-size:13px;
}

input, select{
  width:100%;
  padding:12px;
  margin:8px 0 15px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

/* PASSWORD */
.password-box{
  position:relative;
}

.password-box i{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* ROW */
.row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
}

.remember{
  display:flex;
  align-items:center;
  gap:5px;
}

/* FORGOT */
.forgot{
  color:#ffb300;
  text-decoration:none;
}

/* BUTTON */
.btn{
  width:100%;
  padding:13px;
  background:linear-gradient(45deg,#ffb300,#ff8800);
  border:none;
  border-radius:10px;
  color:#000;
  font-weight:600;
  margin-top:15px;
  cursor:pointer;
}

/* SOCIAL */
.social{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.social button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

/* SIGNUP */
.signup{
  margin-top:15px;
  font-size:13px;
}

.signup a{
  color:#ffb300;
}

/* MOBILE FIX */
@media(max-width:900px){

  .login-container{
    flex-direction:column;
  }

  .left{
    height:35vh;
  }

  .left-content h1{
    font-size:24px;
  }

  .stats{
    gap:10px;
    justify-content:space-around;
  }

  .stats h3{
    font-size:14px;
  }

  .stats p{
    font-size:11px;
  }

  .right{
    padding:15px;
  }

  .form-box{
    padding:25px;
  }

  .social{
    flex-direction:column;
  }

  .back{
    top:15px;
    left:15px;
    font-size:12px;
  }
}

/* EXTRA SMALL */
@media(max-width:480px){

  .left{
    height:30vh;
  }

  .left-content h1{
    font-size:20px;
  }

  .form-box{
    padding:20px;
  }

}
select {
  background: rgba(255,255,255,0.08);
  color: #fff;
  appearance: none;
}

select option {
  background: #111;
  color: #fff;
}

/* FIX FOR WINDOWS / CHROME */
select:focus option:checked {
  background: #ffb300;
  color: #000;
}
</style>
</head>

<body>

<div class="login-container">

  <div class="left">
    <a href="home.html" class="back">← Back</a>

    <div class="left-content">
      <h2>Stackly</h2>
      <h1>Welcome Back!</h1>
      <p>Sign in to continue your journey.</p>

      <div class="stats">
        <div><h3>10K+</h3><p>Products</p></div>
        <div><h3>5K+</h3><p>Clients</p></div>
        <div><h3>15+</h3><p>Years</p></div>
      </div>
    </div>
  </div>

  <div class="right">

    <div class="form-box">

      <h2>Sign In</h2>
      <p>Access your account</p>

      <form id="loginForm">

        <label>Role</label>
        <select id="role" required>
          <option value="">Select role</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Password</label>
        <div class="password-box">
          <input type="password" id="pass" required>
          <i onclick="togglePass()">👁</i>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox"> Remember
          </label>

          <a href="404.html" class="forgot">Forgot?</a>
        </div>

        <button type="submit" class="btn">Sign In</button>

      </form>

      <div class="social">
        <button>Google</button>
        <button>Facebook</button>
      </div>

      <div class="signup">
        Don't have an account? <a href="sign.html">Sign up</a>
      </div>

    </div>

  </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const role = document.getElementById("role").value;

  if(role === ""){
    alert("Please select role!");
    return;
  }

  if(role === "user"){
    window.location.href = "user.html";
  } else {
    window.location.href = "admin.html";
  }
});

function togglePass(){
  const pass = document.getElementById("pass");
  pass.type = pass.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
