<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* MAIN */
.login-container{
  display:flex;
  height:100vh;
}

/* LEFT */
.left{
  flex:1;
  background:url("bbg.png") center/cover no-repeat;
  position:relative;
  color:#fff;
}

.left::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
}

/* BACK */
.back{
  position:absolute;
  top:30px;
  left:30px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  z-index:2;
  transition:0.3s;
}

.back:hover{
  color:#ffb300;
}

/* LEFT CONTENT */
.left-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
  max-width:420px;
}

.left-content h2{
  color:#ffb300;
}

.left-content h1{
  font-size:42px;
  margin:20px 0;
  font-weight:800;
}

.left-content p{
  opacity:0.8;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:40px;
}

.stats h3{
  color:#ffb300;
}

/* RIGHT */
.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#1c1c1c);
}

/* GLASS BOX */
.form-box{
  width:400px;
  padding:40px;
  border-radius:20px;
  background:rgb(0, 0, 0);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

/* TITLE */
.form-box h2{
  font-size:32px;
}

.form-box p{
  font-size:14px;
  opacity:0.7;
  margin-bottom:25px;
}

/* INPUT */
label{
  font-size:13px;
}

input, select{
  width:100%;
  padding:12px;
  margin:8px 0 18px;
  border-radius:10px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

input::placeholder{
  color:#aaa;
}

/* PASSWORD BOX */
.password-box{
  position:relative;
}

.password-box i{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* ROW */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin-top:-5px;
}

.remember{
  display:flex;
  align-items:center;
  gap:6px;
  opacity:0.8;
}

/* FORGOT */
.forgot{
  position:relative;
  color:#ffb300;
  text-decoration:none;
  transition:0.3s;
}

.forgot::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-2px;
  width:0%;
  height:2px;
  background:#ffb300;
  transition:0.3s;
}

.forgot:hover::after{
  width:100%;
}

.forgot:hover{
  color:#fff;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  background:linear-gradient(45deg,#ffb300,#ff8800);
  border:none;
  border-radius:10px;
  color:#000;
  font-weight:700;
  margin-top:20px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(255,180,0,0.4);
}

/* SOCIAL */
.social{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.social button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:#fff;
  cursor:pointer;
}

.social button:hover{
  background:#fff;
  color:#000;
}

/* SIGNUP */
.signup{
  margin-top:20px;
  font-size:13px;
}

.signup a{
  color:#ffb300;
}
select option {
  background: #111;
  color: #fff;
}
/* MOBILE */
@media(max-width:900px){
  .login-container{
    flex-direction:column;
  }

  .left{
    height:40vh;
  }

  .right{
    height:60vh;
  }
}
.role{
background:rgb(0, 0, 0);
}
</style>
</head>

<body>

<div class="login-container">

  <!-- LEFT -->
  <div class="left">
    <a href="home.html" class="back">← Back to Home</a>

    <div class="left-content">
      <h2>Stackly</h2>
      <h1>Welcome Back!</h1>
      <p>Sign in to continue your journey with premium sneakers.</p>

      <div class="stats">
        <div><h3>10K+</h3><p>Products</p></div>
        <div><h3>5K+</h3><p>Clients</p></div>
        <div><h3>15+</h3><p>Years</p></div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="form-box">

      <h2>Sign In</h2>
      <p>Access your Stackly account</p>

      <form id="loginForm">

        <label>Role</label>
        <select id="role" required>
          <option value="">Select role</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Password</label>
        <div class="password-box">
          <input type="password" id="pass" placeholder="Enter password" required>
          <i onclick="togglePass()">👁</i>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>

          <a href="404.html" class="forgot">
            Forgot Password?
          </a>
        </div>

        <button type="submit" class="btn">Sign In →</button>

      </form>

      <div class="social">
        <button>Google</button>
        <button>Facebook</button>
      </div>

      <div class="signup">
        Don't have an account? <a href="sign.html">Sign up</a>
      </div>

    </div>

  </div>

</div>

<script>

// LOGIN REDIRECT
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const role = document.getElementById("role").value;

  if(role === ""){
    alert("Please select role!");
    return;
  }

  if(role === "user"){
    window.location.href = "user.html";
  }
  else if(role === "admin"){
    window.location.href = "admin.html";
  }
});

// PASSWORD TOGGLE
function togglePass(){
  const pass = document.getElementById("pass");
  pass.type = pass.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
