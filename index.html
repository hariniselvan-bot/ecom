<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0d0d0d;
  color:#fff;
  flex-direction:column;
}

/* LOGO */
.logo{
  font-size:42px;
  font-weight:800;
  color:#ffb300;
  margin-bottom:25px;
  animation:fade 1.5s infinite alternate;
}

/* SPINNER */
.loader{
  width:70px;
  height:70px;
  border:6px solid #333;
  border-top:6px solid #ffb300;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

/* TEXT */
.text{
  margin-top:15px;
  opacity:0.7;
  font-size:14px;
}

/* ANIMATION */
@keyframes spin{
  100%{ transform:rotate(360deg); }
}

@keyframes fade{
  0%{opacity:0.4;}
  100%{opacity:1;}
}
</style>

</head>

<body>

<div class="logo">STACKLY</div>

<div class="loader"></div>

<p class="text">Loading your experience...</p>

<script>
// 🔥 REDIRECT TO HOME PAGE
setTimeout(()=>{
  window.location.href = "home.html";
}, 2500);
</script>

</body>
</html>
